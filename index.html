<script>

function cartGet(){try{return JSON.parse(localStorage.getItem('carrito')||'[]');}catch(e){return [];}}
function cartSet(c){localStorage.setItem('carrito',JSON.stringify(c));cartBadge();cartRender();}
function cartNum(p){var m=String(p||'').replace(/[^0-9.,]/g,'').replace(',','.');var v=parseFloat(m);return isNaN(v)?0:v;}
function cartMoney(v){return '$'+v.toFixed(2);}
function cartBadge(){var t=0;cartGet().forEach(function(i){t+=i.q;});
  document.querySelectorAll('.el.btn').forEach(function(b){
    if(b.dataset.cart==='1'){var s=b.querySelector('.cbadge');
      if(!s){s=document.createElement('span');s.className='cbadge';b.appendChild(s);}
      s.textContent=t>0?t:'';}});}
function cartAdd(name,price,img){var c=cartGet();var f=null;
  c.forEach(function(i){if(i.name===name)f=i;});
  if(f){f.q++;}else{c.push({name:name,price:price,img:img,q:1});}
  cartSet(c);cartToast(name+' agregado al carrito');}
function cartToast(msg){var d=document.createElement('div');d.className='ctoast';
  d.textContent=msg;document.body.appendChild(d);
  setTimeout(function(){d.classList.add('off');},1800);
  setTimeout(function(){d.remove();},2400);}
function cartRowAbs(it,ix,cfg,P){
  var r=P.row,im=P.img,nm=P.name,pr=P.price,bt=P.btn;
  var img=it.img?'<img src="'+it.img+'" alt="">':'<div class="cph"></div>';
  var line=cartMoney(cartNum(it.price)*it.q);
  var h='<div class="crow abs" style="width:'+r[0]+'px;height:'+r[1]+'px;background:'+r[2]+
        ';border-radius:'+r[3]+'px;border:'+r[4]+'px solid '+r[5]+';'+(r[6]?'box-shadow:0 8px 20px rgba(0,0,0,.12);':'')+'">';
  h+='<div class="cimg" style="left:'+im[0]+'px;top:'+im[1]+'px;width:'+im[2]+'px;height:'+im[3]+
     'px;border-radius:'+im[4]+'px;border:'+im[5]+'px solid '+im[6]+'">'+img+'</div>';
  h+='<b class="cname" style="left:'+nm[0]+'px;top:'+nm[1]+'px;font-size:'+nm[2]+'px;color:'+nm[3]+'">'+it.name+'</b>';
  h+='<span class="cprice" style="left:'+pr[0]+'px;top:'+pr[1]+'px;font-size:'+pr[2]+'px;color:'+pr[3]+'">'+it.price+'</span>';
  h+='<div class="cqty" style="left:'+pr[0]+'px;top:'+(pr[1]+pr[2]+14)+'px"><button data-a="-" data-i="'+ix+'">-</button><span>'+it.q+'</span><button data-a="+" data-i="'+ix+'">+</button></div>';
  h+='<span class="ctot abs" style="left:'+(pr[0]+170)+'px;top:'+pr[1]+'px;font-size:'+pr[2]+'px;color:'+(cfg.accent||'#16a34a')+'">'+line+'</span>';
  var bst='left:'+bt[0]+'px;top:'+bt[1]+'px;width:'+bt[2]+'px;height:'+bt[3]+
     'px;background:'+bt[4]+';color:'+bt[5]+';border-radius:'+bt[6]+'px;font-size:'+(bt[7]+2)+'px';
  var btxt=((bt[9]||'')+' '+(bt[8]||'')).trim();
  if(cfg.tpl>=3){
    h+='<button class="cdel cpaybtn" style="'+bst+'">'+btxt+'</button>';
    h+='<button class="clink abs" data-a="x" data-i="'+ix+'" style="left:'+nm[0]+'px;top:'+(r[1]-34)+'px">'+(cfg.del_text||'Eliminar')+'</button>';
  }else{
    h+='<button class="cdel" data-a="x" data-i="'+ix+'" style="'+bst+'">'+btxt+'</button>';
  }
  return h+'</div>';}
function cartRenderRoot(root){
  var cfg={};try{cfg=JSON.parse(root.dataset.cfg||'{}');}catch(e){}
  var items=cartGet();
  if(!items.length){root.innerHTML='<div class="cempty">'+(cfg.empty_text||'Tu carrito esta vacio')+'</div>';return;}
  var total=0;items.forEach(function(i){total+=cartNum(i.price)*i.q;});
  var rows;
  if(cfg.pos){rows=items.map(function(it,ix){return cartRowAbs(it,ix,cfg,cfg.pos);}).join('');}
  else{rows=items.map(function(it,ix){
    var img=it.img?'<img src="'+it.img+'" alt="">':'<div class="cph"></div>';
    var qty='<div class="cqty"><button data-a="-" data-i="'+ix+'">-</button><span>'+it.q+'</span><button data-a="+" data-i="'+ix+'">+</button></div>';
    var trash='<button class="ctrash" data-a="x" data-i="'+ix+'" style="color:'+(cfg.trash_color||'#ef4444')+';font-size:'+(cfg.trash_size||18)+'px">'+(cfg.trash_glyph||'&#128465;')+'</button>';
    if(cfg.tpl===2){
      return '<div class="crow tpl2" style="border-radius:'+(cfg.radius||14)+'px">'+img+
        '<div class="cinfo"><b>'+it.name+'</b><span>'+it.price+' c/u</span></div>'+qty+
        '<span class="cprice2" style="background:'+(cfg.accent||'#16a34a')+'">'+cartMoney(cartNum(it.price)*it.q)+'</span>'+
        '<span class="ctrashbox" style="background:'+(cfg.trash_color||'#ef4444')+'">'+trash+'</span></div>';
    }
    if(cfg.tpl===3){
      return '<div class="crow tpl3">'+img+'<div class="cinfo"><b>'+it.name+'</b><span style="color:'+(cfg.accent||'#16a34a')+'">'+it.price+'</span></div>'+
        qty+'<div class="ctot">'+cartMoney(cartNum(it.price)*it.q)+'</div>'+
        '<button class="clink" data-a="x" data-i="'+ix+'">'+(cfg.del_text||'Quitar')+'</button></div>';
    }
    return '<div class="crow tpl1">'+img+'<div class="cinfo"><b>'+it.name+'</b>'+
      '<span style="color:'+(cfg.accent||'#16a34a')+'">'+it.price+'</span>'+
      '<div class="cactions">'+qty+trash+'<button class="clink" data-a="x" data-i="'+ix+'">'+(cfg.del_text||'Eliminar')+'</button></div></div>'+
      '<div class="ctot">'+cartMoney(cartNum(it.price)*it.q)+'</div></div>';
  }).join('');}
  root.innerHTML='<div class="clist">'+rows+'</div>'+
    '<div class="csum"><div class="crowtot"><span>'+(cfg.total_text||'Total')+'</span><b>'+cartMoney(total)+'</b></div>'+
    '<button class="cpay" style="background:'+(cfg.pay_bg||'#f5c451')+';color:'+(cfg.pay_fg||'#111827')+
    ';border-radius:'+(cfg.radius||14)+'px">'+(cfg.pay_text||'Ir a pagar')+'</button></div>';
  root.querySelectorAll('button[data-a]').forEach(function(b){
    b.addEventListener('click',function(){
      var c=cartGet(),i=parseInt(b.dataset.i,10),a=b.dataset.a;
      if(a==='+')c[i].q++; else if(a==='-'){c[i].q--;if(c[i].q<1)c.splice(i,1);} else c.splice(i,1);
      cartSet(c);});});
}
function cartRender(){document.querySelectorAll('.cart-root,#cart-root').forEach(cartRenderRoot);}
document.addEventListener('click',function(e){
  var b=e.target.closest('.addcart');if(!b)return;e.preventDefault();
  cartAdd(b.dataset.name,b.dataset.price,b.dataset.img||'');});
document.addEventListener('DOMContentLoaded',function(){cartBadge();cartRender();});

/* ---------- BUSCADOR DE PRODUCTOS ---------- */
function sNorm(s){return String(s||'').toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
function sFind(q){
  var n=sNorm(q); if(!n) return [];
  var all=(window.SITE_PRODUCTS||[]);
  var starts=[],has=[];
  all.forEach(function(p){var nm=sNorm(p.name);
    if(nm.indexOf(n)===0)starts.push(p); else if(nm.indexOf(n)>-1)has.push(p);});
  return starts.concat(has);
}
function sPanel(){
  var p=document.getElementById('search-panel');
  if(p) return p;
  p=document.createElement('div');p.id='search-panel';p.className='spanel';
  p.innerHTML='<div class="sbox"><div class="shead"><b id="stitle">Resultados</b>'+
    '<button class="sclose" type="button">&times;</button></div>'+
    '<div class="sgrid" id="sgrid"></div></div>';
  document.body.appendChild(p);
  p.addEventListener('click',function(e){
    if(e.target===p||e.target.classList.contains('sclose'))p.style.display='none';});
  return p;
}
function sRun(q){
  var res=sFind(q),p=sPanel();
  document.getElementById('stitle').textContent=
    q?('Resultados para "'+q+'" ('+res.length+')'):'Resultados';
  var g=document.getElementById('sgrid');
  if(!res.length){g.innerHTML='<div class="sempty">No se encontraron productos'+
    (q?(' con "'+q+'"'):'')+'.</div>';}
  else{g.innerHTML=res.map(function(it){
    return '<article class="scard">'+
      (it.img?('<img src="'+it.img+'" alt="">'):'<div class="sph"></div>')+
      '<h4>'+it.name+'</h4><p class="sprice">'+(it.price||'')+'</p>'+
      '<div class="sacts"><button class="addcart sadd" type="button" data-name="'+
      String(it.name).replace(/"/g,"'")+'" data-price="'+
      String(it.price||'').replace(/"/g,"'")+'" data-img="'+(it.img||'')+
      '">Agregar al carrito</button>'+
      (it.page?('<a class="sgo" href="'+it.page+'">Ver</a>'):'')+'</div></article>';
  }).join('');}
  p.style.display='flex';
}
function sQuery(from){
  var box=from?from.closest('.block'):null;
  var inp=(box&&box.querySelector('.el.search input'))||
          document.querySelector('.el.search input');
  return inp?inp.value:'';
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-search]');if(!b)return;
  e.preventDefault();sRun(sQuery(b));});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var i=e.target.closest('.el.search input');if(!i)return;
  e.preventDefault();sRun(i.value);});

/* Ajuste del ancho: si el navegador no soporta zoom, se usa transform
   para que la pagina SIEMPRE se vea completa y sin margenes. */
/* Menu de paginas: al hacer click en el boton se muestra la tarjeta,
   y al volver a hacer click se esconde. */
document.addEventListener('click', function(ev){
  var btn = ev.target.closest && ev.target.closest('[data-menubtn]');
  var cards = document.querySelectorAll('[data-navmenu]');
  if(btn){
    ev.preventDefault();
    var open = false;
    cards.forEach(function(c){
      open = (c.style.display === 'none' || !c.style.display);
      c.style.display = open ? 'flex' : 'none';
    });
    return;
  }
  if(ev.target.closest && ev.target.closest('[data-navmenu]')) return;
  cards.forEach(function(c){ c.style.display = 'none'; });
});

(function(){
  var BASE_PC = 1906, BASE_MB = 440;
  var okZoom = (window.CSS && CSS.supports && CSS.supports('zoom','1'));
  function fit(){
    var vw = document.documentElement.clientWidth;
    document.querySelectorAll('.view').forEach(function(v){
      if(getComputedStyle(v).display === 'none'){ v.style.height=''; return; }
      var mb = v.classList.contains('only-mb');
      var base = mb ? BASE_MB : BASE_PC;
      /* En PC nunca se agranda (k maximo = 1): todo conserva su tamano. */
      var k = mb ? (vw / base) : Math.min(1, vw / base);
      if(k >= 0.999){
        v.style.zoom = ''; v.style.transform = ''; v.style.marginLeft = '0';
        v.style.width = '100%'; v.style.height = '';
        return;
      }
      if(okZoom){
        v.style.transform = '';
        v.style.zoom = k;
        v.style.width = (vw / k) + 'px';   /* sin margenes a los lados */
        v.style.height = '';
      }else{
        v.style.zoom = '';
        v.style.width = (vw / k) + 'px';
        v.style.transform = 'scale(' + k + ')';
        v.style.marginLeft = '0';
        v.style.height = (v.scrollHeight * k) + 'px';
      }
    });
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  window.addEventListener('orientationchange', fit);
})();
document.querySelectorAll('.carousel').forEach(function(c){
  var s=c.querySelectorAll('.slide'), i=0, ms=parseInt(c.dataset.ms||'4000',10);
  if(s.length<2) return;
  setInterval(function(){ s[i].classList.remove('on'); i=(i+1)%s.length;
    s[i].classList.add('on'); }, ms);
});
